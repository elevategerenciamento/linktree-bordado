<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ana Carolina - Artista Têxtil. Explore meu portfólio, encomende peças exclusivas e descubra riscos para bordar.">
    <title>Ana Carolina | Artista Têxtil</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Cabeçalho com Foto em Arco -->
        <header class="profile-header">
            <div class="image-arch">
                <img src="foto_perfil.jpg" alt="Ana Carolina Artista Têxtil">
            </div>
            <h1 class="name">Ana Carolina</h1>
            <p class="subtitle">ARTISTA TÊXTIL</p>
        </header>

        <!-- Botões de Links -->
        <main class="links">
            <a href="#" class="link-button" id="portfolio">PORTFÓLIO E VALORES</a>
            <a href="#" class="link-button" id="encomenda">ENCOMENDE AQUI</a>
            <a href="#" class="link-button" id="riscos">RISCOS PARA BORDAR</a>
        </main>

        <!-- Logo da Marca -->
        <div class="logo-container">
            <img src="logo.png" alt="Logo Ana Carolina" class="logo">
        </div>

        <!-- Rodapé com Link do Instagram -->
        <footer class="footer">
            <a href="https://instagram.com/bordadosanafersan" class="instagram-link" target="_blank">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                @bordadosanafersan
            </a>
        </footer>
    </div>
</body>
</html>
